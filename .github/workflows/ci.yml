name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6
      - name: Install workspace
        run: uv sync --all-packages --group dev
      - name: Lint
        run: uv run ruff check apps packages tools tests
      - name: Test
        run: uv run pytest -q -m "not spark"

  web-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install web workspace
        run: pnpm install --frozen-lockfile=false
      - name: Lint web
        run: pnpm web:lint
      - name: Test web
        run: pnpm --dir apps/web test --run
      - name: Build web
        run: pnpm web:build

  spark-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      - name: Install core workspace
        run: uv sync --all-packages --group dev
      - name: Run Spark contract test
        run: uv run --with "pyspark>=4.0,<4.1" pytest tests/test_spark_engine_contract.py -q -m spark
