name: One-time repository asset migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/migrate-large-assets.yml"

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download source repository assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dataset notebook docs/legacy src/api
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/JaimeArriagadaRosas/clinical-drg-predictor/main/dataset/dataset_elpino.csv" \
            --output dataset/dataset_elpino.csv
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/JaimeArriagadaRosas/clinical-drg-predictor/main/notebook/EDA.ipynb" \
            --output notebook/EDA.ipynb
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/JaimeArriagadaRosas/clinical-drg-predictor/main/docs/README.md" \
            --output docs/legacy/academic-readme.md
          curl --fail --location --retry 3 \
            "https://raw.githubusercontent.com/JaimeArriagadaRosas/clinical-drg-predictor/main/src/api/prompts.py" \
            --output src/api/prompts.py

      - name: Commit migrated assets and remove migration workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/migrate-large-assets.yml
          git config user.name "Jaime Andrés Arriagada Rosas"
          git config user.email "163452202+JaimeArriagadaRosas@users.noreply.github.com"
          git add dataset/dataset_elpino.csv notebook/EDA.ipynb docs/legacy/academic-readme.md src/api/prompts.py .github/workflows/migrate-large-assets.yml
          git commit -m "chore: complete clean repository asset migration"
          git push origin HEAD:main
