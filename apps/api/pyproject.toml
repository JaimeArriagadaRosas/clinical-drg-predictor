[project]
name = "clinical-api"
version = "0.1.0"
description = "HTTP API for the Clinical Intelligence Platform"
requires-python = ">=3.11,<3.14"
dependencies = [
  "clinical-core",
  "clinical-drg",
  "clinical-fhir",
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.34.0",
]

[tool.uv.sources]
clinical-core = { workspace = true }
clinical-drg = { workspace = true }
clinical-fhir = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_api"]
