[project]
name = "clinical-runtime"
version = "0.1.0"
description = "Local lifecycle and developer runtime for the Clinical Intelligence Platform"
requires-python = ">=3.11,<3.14"
dependencies = [
  "rich>=14,<15",
  "typer>=0.16,<1",
]

[project.scripts]
clinical-platform = "clinical_runtime.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_runtime"]
