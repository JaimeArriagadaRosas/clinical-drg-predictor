[project]
name = "clinical-data"
version = "0.1.0"
description = "Canonical hospital encounter contracts and clinical data engineering"
requires-python = ">=3.11,<3.14"
dependencies = [
  "duckdb>=1.3,<2",
  "polars>=1.32,<2",
  "pyarrow>=19,<22",
  "pydantic>=2.11,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_data"]
