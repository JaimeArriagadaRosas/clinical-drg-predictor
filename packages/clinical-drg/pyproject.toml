[project]
name = "clinical-drg"
version = "0.1.0"
description = "GRD prediction domain and inference orchestration"
requires-python = ">=3.11,<3.14"
dependencies = [
  "clinical-core",
  "joblib>=1.4,<2",
  "scikit-learn>=1.6,<2.0",
]

[tool.uv.sources]
clinical-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_drg"]
