[project]
name = "clinical-fhir"
version = "0.1.0"
description = "FHIR interoperability adapters for clinical prediction contracts"
requires-python = ">=3.11,<3.14"
dependencies = ["clinical-core"]

[tool.uv.sources]
clinical-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_fhir"]
