[project]
name = "clinical-ml"
version = "0.1.0"
description = "Reusable machine-learning workflows for clinical GRD prediction"
requires-python = ">=3.11,<3.14"
dependencies = [
  "clinical-data",
  "joblib>=1.4,<2",
  "mlflow>=3,<4",
  "numpy>=1.26",
  "scikit-learn>=1.6,<2",
]

[tool.uv.sources]
clinical-data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_ml"]
