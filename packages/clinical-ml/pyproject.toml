[project]
name = "clinical-ml"
version = "0.1.0"
description = "Reusable machine-learning workflows for clinical GRD prediction"
requires-python = ">=3.11,<3.14"
dependencies = [
  "clinical-data",
  "numpy>=1.26",
]

[tool.uv.sources]
clinical-data = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_ml"]
