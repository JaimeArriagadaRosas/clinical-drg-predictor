[project]
name = "clinical-intelligence-platform-workspace"
version = "0.1.0"
description = "Clinical data and machine-learning platform for GRD prediction and analytics"
requires-python = ">=3.11,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.5",
  "ruff>=0.11.0",
]

[tool.uv.workspace]
members = [
  "apps/api",
  "packages/clinical-core",
  "packages/clinical-drg",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  ".",
  "apps/api/src",
  "packages/clinical-core/src",
  "packages/clinical-drg/src",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["notebook", "dataset", "src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
