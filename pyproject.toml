[project]
name = "clinical-intelligence-platform-workspace"
version = "0.1.0"
description = "Clinical data and machine-learning platform for GRD prediction and analytics"
requires-python = ">=3.11,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "httpx>=0.28.1",
  "pytest>=8.3.5",
  "pyyaml>=6.0",
  "ruff>=0.11.0",
]
training = [
  "lightgbm>=4.5,<5.0",
  "numpy>=1.26",
  "pandas>=2.2",
]
legacy-chatbot = [
  "flask>=3.1",
  "google-generativeai>=0.8.5,<1.0",
  "python-dotenv>=1.0",
]

[tool.uv.workspace]
members = [
  "apps/api",
  "apps/runtime",
  "packages/clinical-core",
  "packages/clinical-data",
  "packages/clinical-drg",
  "packages/clinical-fhir",
  "packages/clinical-ml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [
  ".",
  "apps/api/src",
  "apps/runtime/src",
  "packages/clinical-core/src",
  "packages/clinical-data/src",
  "packages/clinical-drg/src",
  "packages/clinical-fhir/src",
  "packages/clinical-ml/src",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["notebook", "dataset", "src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
